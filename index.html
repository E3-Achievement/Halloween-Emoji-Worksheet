.ws .writein{flex:1 1 200px;min-width:160px;font:inherit;font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 12px;border:3px solid #cbbde0;border-radius:10px}

.ws .keypage h1{margin:0 0 6px;font-size:26px;color:var(--purple)}

@media (max-width:640px){
  .ws .top{flex-direction:column;align-items:stretch}
  .ws .name{max-width:none;flex:0 0 44px}
  .ws .top h1{font-size:26px}
  .ws .emo{font-size:42px}
  .ws .match{padding:0 6px}
  .ws .num{width:52px;height:52px;font-size:32px}

}

        cell.tabIndex = 0; cell.setAttribute('role', 'button'); cell.setAttribute('aria-label', side === 'L' ? 'Picture ' + (idx + 1) : 'Match ' + (idx + 1));
        cell.addEventListener('click', () => tap(side, idx));
        cell.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tap(side, idx); } });
      }));
      window.addEventListener('resize', redraw);
      return {el:wrap, check:() => { let g = 0; Object.keys(conns).forEach(l => { if (perm[conns[l]] === +l) g++; }); return {got:g, total:n}; }};
    }
  };

  /* ---------- 2. circle the different one ---------- */
  const ODD_POS = [2,3,1,2,0];
  T.odd = {
    label:'Circle the different one', hint:'⭕',
    instr:() => 'Circle the one that is different',
    key:s => s.rows.map((r, i) => 'Row ' + (i+1) + ': ' + r[1]).join(',  '),
    build(s, ctx){
      const box = h('div');
      const groups = [];
      s.rows.forEach((r, i) => {
        const p = ODD_POS[i % 5];
        const cells = [0,1,2,3].map(k => pic(k === p ? r[1] : r[0], s));
        cells.forEach(c => c.classList.add('cellpick'));
        box.appendChild(h('div', {class:'row'}, cells));
        groups.push({cells, p, sel: ctx.mode === 'digital' ? selectable(cells) : null});
      });
      return {el:box, check: ctx.mode === 'digital' ? () => ({got: groups.filter(g => g.sel[0] === g.p).length, total: groups.length}) : null};
    }
  };

  /* ---------- 3. counting ---------- */
  T.count = {
    label:'Counting', hint:'🔢',
    instr:() => 'Circle how many',
    key:s => s.rows.map(r => (VOCAB[r.e] ? VOCAB[r.e].toUpperCase() : r.e) + ' = ' + r.n).join(',  '),
    build(s, ctx){
      const style = s.picStyle || 'pic';
      const box = h('div'); const groups = [];
      s.rows.forEach(r => {
        const start = Math.max(1, r.n - 1), opts = [start, start+1, start+2], correct = opts.indexOf(r.n);
        const nums = opts.map(v => h('span', {class:'num'}, String(v)));
        const group = (style === 'word' && VOCAB[r.e])
          ? h('div', {class:'group wordgroup'}, Array(r.n).fill(0).map(() => h('span', {class:'wchip'}, VOCAB[r.e].toUpperCase())))
          : h('div', {class:'group'}, Array(r.n).fill(r.e).join(''));
        box.appendChild(h('div', {class:'count-row'}, group, h('div', {class:'nums'}, nums)));
        groups.push({correct, sel: ctx.mode === 'digital' ? selectable(nums) : null});
      });
      return {el:box, check: ctx.mode === 'digital' ? () => ({got: groups.filter(g => g.sel[0] === g.correct).length, total: groups.length}) : null};
    }
  };

  /* ---------- 4. customer order ---------- */
  T.customer = {
    label:'Customer order', hint:'⭕',
    instr:(s, mode) => (s.picStyle === 'word') ? 'Read what the customer wants. Circle it.' : 'The customer wants this. Circle it.',
    key:s => clamp(s.qty,1,4) + ' bag' + (s.qty > 1 ? 's' : '') + ' with ' + (VOCAB[s.answer] ? VOCAB[s.answer].toUpperCase() : s.answer),
    build(s, ctx){
      const qty = clamp(+s.qty || 1, 1, 4);
      let opts = s.options.slice(0,5); if (opts.indexOf(s.answer) < 0) opts = opts.slice(0,4).concat([s.answer]);
      const style = s.picStyle || 'pic';
      const box = h('div');
      if (style === 'word' && VOCAB[s.answer]) {
        box.appendChild(h('div', {class:'bubble wordbubble'}, h('span', {class:'wtext sentence'}, 'The customer wants ' + qty + ' bag' + (qty > 1 ? 's' : '') + ' with a ' + VOCAB[s.answer].toUpperCase() + '.')));
      } else {
        box.appendChild(h('div', {class:'bubble'}, emo('🧑'), emo('💬'), emo(Array(qty).fill('🛍️').join('')), emo(s.answer)));
      }
      box.appendChild(h('p', {class:'q'}, 'How many bags?'));
      const q1 = [1,2,3,4].map(v => h('span', {class:'num'}, String(v)));
      box.appendChild(h('div', {class:'nums spread'}, q1));
      box.appendChild(h('p', {class:'q'}, style === 'word' ? 'Which word matches?' : 'Which picture goes on the bag?'));
      const q2 = opts.map(o => pic(o, s)); q2.forEach(c => c.classList.add('cellpick'));
      box.appendChild(h('div', {class:'row'}, q2));
      if (ctx.mode !== 'digital') return {el:box};
      const s1 = selectable(q1), s2 = selectable(q2);
      return {el:box, check:() => ({got:(s1[0] === qty - 1 ? 1 : 0) + (s2[0] === opts.indexOf(s.answer) ? 1 : 0), total:2})};
    }
  };

  /* ---------- 5. color match ---------- */
  T.colors = {
    label:'Color match', hint:'🎨',
    instr:() => 'Circle the two colors the customer picked',
    key:s => s.c1 + ' and ' + s.c2,
    build(s, ctx){
      const t = [s.c1, s.c2];
      const others = NAMES.filter(n => t.indexOf(n) < 0).slice(0,3);
      const opts = [others[0], t[0], others[1], t[1], others[2]];
      const style = s.picStyle || 'pic';
      const sw = n => {
        const wrap = h('span', {class:'swatchwrap'}, h('span', {class:'swatch', style:'background:' + PALETTE[n], title:n, 'aria-label':n}));
        if (style === 'word') wrap.appendChild(h('span', {class:'wlabel'}, n.toUpperCase()));
        return wrap;
      };
      const box = h('div');
      box.appendChild(h('div', {class:'bubble'}, style === 'word' ? h('span', {class:'wtext sentence'}, 'The customer wants these colors:') : emo('💬'), sw(t[0]), sw(t[1])));
      const els = opts.map(sw);
      box.appendChild(h('div', {class:'swatches'}, els));
      if (ctx.mode !== 'digital') return {el:box};
      const sel = selectable(els, {max:2});
      return {el:box, check:() => ({got: sel.filter(i => t.indexOf(opts[i]) >= 0).length, total:2})};
    }
  };

  /* ---------- 6. check the design ---------- */
  T.compare = {
    label:'Check the design', hint:'🔍',
    instr:() => 'Check the design. Circle the one that matches.',
    key:s => { const o = s.options.indexOf(s.sample); return 'Matching square is number ' + ((o < 0 ? 1 : o) + 1) + ' (' + s.sample + '). In the mistake row, square 3 (' + s.variant + ') is different from ' + s.base + '.'; },
    build(s, ctx){
      let opts = s.options.slice(0,3); let ok = opts.indexOf(s.sample); if (ok < 0) { opts[1] = s.sample; ok = 1; }
      const box = h('div');
      const optEls = opts.map(o => h('div', {class:'sq'}, o));
      box.appendChild(h('div', {class:'compare'},
        h('div', null, h('div', {class:'lbl'}, emo('✅')), h('div', {class:'sq sample'}, s.sample)),
        emo('👉'),
        h('div', {class:'options'}, optEls)));
      box.appendChild(h('p', {class:'q'}, 'Which one has a mistake? Put an X on it.'));
      const mEls = [s.base, s.base, s.variant].map(o => h('div', {class:'sq'}, o));
      box.appendChild(h('div', {class:'compare'}, h('div', {class:'options'}, mEls)));
      if (ctx.mode !== 'digital') return {el:box};
      const a = selectable(optEls), b = selectable(mEls, {cls:'xmark'});
      return {el:box, check:() => ({got:(a[0] === ok ? 1 : 0) + (b[0] === 2 ? 1 : 0), total:2})};
    }
  };

  /* ---------- 7. put in order ---------- */
  T.order = {
    label:'Put in order', hint:'🔢',
    instr:(s, mode) => mode === 'digital' ? 'What comes first? Tap the pictures in order. The 1 is done.' : 'What comes first? Write 1 to ' + s.steps.length + '.',
    key:s => s.steps.map(e => e + (LEGEND[e] ? ' ' + LEGEND[e] : '')).join('  →  ') + '  (numbers 1 to ' + s.steps.length + ')',
    build(s, ctx){
      const steps = s.steps.slice(0,6), n = steps.length, perm = OPERMS[n] || OPERMS[5];
      const wrap = h('div', {class:'steps'}); const assigned = {};
      perm.forEach(ci => {
        const box = h('div', {class:'numbox' + (ci === 0 ? ' done' : '')}, ci === 0 ? '1' : '');
        const st = h('div', {class:'step'}, pic(steps[ci], s), box);
        wrap.appendChild(st);
        if (ctx.mode === 'digital' && ci !== 0) {
          st.classList.add('click'); st.tabIndex = 0; st.setAttribute('role', 'button');
          const tog = () => {
            if (assigned[ci]) { delete assigned[ci]; box.textContent = ''; box.classList.remove('set'); }
            else { const used = Object.keys(assigned).map(k => assigned[k]); let k = 2; while (used.indexOf(k) >= 0) k++; assigned[ci] = k; box.textContent = String(k); box.classList.add('set'); }
          };
          st.addEventListener('click', tog);
          st.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tog(); } });
        }
      });
      const box = h('div', null, wrap, ctx.mode === 'digital' ? null : h('div', {class:'startnote'}, 'The purple 1 is done for you. Start at 2.'));
      return {el:box, check: ctx.mode === 'digital' ? () => { let g = 0; for (let ci = 1; ci < n; ci++) if (assigned[ci] === ci + 1) g++; return {got:g, total:n - 1}; } : null};
    }
  };

  /* ---------- 8. word match ---------- */
  T.word = {
    label:'Word match', hint:'⭐ try it!',
    instr:() => 'Circle the word that matches',
    key:s => s.rows.map(r => r.w).join(', '),
    build(s, ctx){
      const box = h('div'); const groups = [];
      s.rows.forEach((r, i) => {
        const left = i % 2 === 0;
        const w1 = h('span', {class:'word'}, left ? r.w : r.d), w2 = h('span', {class:'word'}, left ? r.d : r.w);
        box.appendChild(h('div', {class:'wordrow'}, emo(r.e), h('div', {class:'words'}, w1, w2)));
        groups.push({correct: left ? 0 : 1, sel: ctx.mode === 'digital' ? selectable([w1, w2]) : null});
      });
      return {el:box, check: ctx.mode === 'digital' ? () => ({got: groups.filter(g => g.sel[0] === g.correct).length, total: groups.length}) : null};
    }
  };

  /* ---------- 9. draw your own ---------- */
  T.draw = {
    label:'Draw your own', hint:'🎨',
    instr:(s, mode) => mode === 'digital' ? 'Draw your bag design. Tap a picture to stamp it, or draw with the pen.' : 'Circle 2 things. Draw them in the box.',
    key:() => 'Any picture is correct. Students can use the drawing as a plan for their Canva square.',
    build(s, ctx){
      const picks = s.picks.slice(0,8);
      if (ctx.mode !== 'digital') {
        return {el:h('div', {class:'draw'}, h('div', {class:'picks'}, picks.map(e => pic(e, s))), h('div', {class:'canvas', role:'img', 'aria-label':'Square drawing box'}))};
      }
      const cv = h('canvas', {width:720, height:720, class:'dcanvas'});
      const c = cv.getContext('2d');
      const ops = []; let cur = null, stamp = null, color = '#1c1526';
      const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      const style = s.picStyle || 'pic';
      const wordMode = style === 'word';
      const redraw = () => {
        c.fillStyle = '#fff'; c.fillRect(0, 0, 720, 720);
        c.strokeStyle = '#f7ecdf'; c.lineWidth = 2;
        for (let i = 60; i < 720; i += 60) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, 720); c.stroke(); c.beginPath(); c.moveTo(0, i); c.lineTo(720, i); c.stroke(); }
        ops.forEach(o => {
          if (o.t === 's') {
            if (o.word) { c.font = 'bold 46px "Trebuchet MS",sans-serif'; c.fillStyle = '#1c1526'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.word, o.x, o.y); }
            else { c.font = '120px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.e, o.x, o.y); }
          } else {
            c.strokeStyle = o.c; c.fillStyle = o.c; c.lineWidth = 10; c.lineCap = 'round'; c.lineJoin = 'round';
            if (o.pts.length === 1) { c.beginPath(); c.arc(o.pts[0][0], o.pts[0][1], 5, 0, 7); c.fill(); }
            else { c.beginPath(); c.moveTo(o.pts[0][0], o.pts[0][1]); o.pts.slice(1).forEach(p => c.lineTo(p[0], p[1])); c.stroke(); }
          }
        });
      };
      const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 720 / r.width, (e.clientY - r.top) * 720 / r.height]; };
      cv.addEventListener('pointerdown', e => {
        e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(_) {}
        const p = pos(e);
        if (stamp !== null) { const e0 = picks[stamp]; ops.push({t:'s', e:e0, word: (wordMode && VOCAB[e0]) ? VOCAB[e0].toUpperCase() : null, x:p[0], y:p[1]}); }
        else { cur = {t:'p', c:color, pts:[p]}; ops.push(cur); }
        redraw();
      });
      cv.addEventListener('pointermove', e => { if (cur) { cur.pts.push(pos(e)); redraw(); } });
      const stop = () => { cur = null; };
      cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

      const colorBtns = ['#1c1526','#d62828','#f47b20','#2e9e47','#1e6fd9','#6b3fa0'].map(col => h('button', {type:'button', class:'chipbtn' + (col === color ? ' on' : ''), style:'background:' + col, 'aria-label':'Pen color', onclick:() => { color = col; stamp = null; sync(); }}));
      const stampBtns = picks.map((e, i) => h('button', {type:'button', class:'stampbtn' + (wordMode ? ' textstamp' : ''), title:VOCAB[e] || 'Stamp', 'aria-label':'Stamp' + (VOCAB[e] ? ': ' + VOCAB[e] : ''), onclick:() => { stamp = stamp === i ? null : i; sync(); }}, (wordMode && VOCAB[e]) ? VOCAB[e].toUpperCase() : e));
      const sync = () => {
        colorBtns.forEach((b, i) => b.classList.toggle('on', stamp === null && b.style.background !== '' && ['#1c1526','#d62828','#f47b20','#2e9e47','#1e6fd9','#6b3fa0'][i] === color));
        stampBtns.forEach((b, i) => b.classList.toggle('on', stamp === i));
      };
      sync();
      const undo = h('button', {type:'button', class:'tbtn', onclick:() => { ops.pop(); redraw(); }}, '↩️ Undo');
      const clear = h('button', {type:'button', class:'tbtn', onclick:() => { ops.length = 0; redraw(); }}, '🧽 Clear');
      redraw();
      const el = h('div', null, h('div', {class:'dtools'}, colorBtns, h('span', {class:'sepbar'}), stampBtns, h('span', {class:'sepbar'}), undo, clear), cv);
      return {el, canvas:cv, hasDrawing:() => ops.length > 0};
    }
  };

  /* ---------- 10. write the word (no pictures) ---------- */
  T.write = {
    label:'Write the word', hint:'✍️',
    instr:(s, mode) => mode === 'digital' ? 'Look at the word. Type it in the box.' : 'Trace the word, then write it on the line.',
    key:s => s.words.join(', '),
    build(s, ctx){
      const words = s.words.slice(0,4);
      const box = h('div'); const rows = [];
      words.forEach(wd => {
        const row = h('div', {class:'writerow'}, h('span', {class:'tracer'}, wd));
        if (ctx.mode === 'digital') {
          const inp = h('input', {type:'text', class:'writein', autocomplete:'off', autocapitalize:'characters', 'aria-label':'Type the word ' + wd});
          row.appendChild(inp); rows.push({wd, inp});
        } else {
          row.appendChild(h('span', {class:'writeline'}));
        }
        box.appendChild(row);
      });
      if (ctx.mode !== 'digital') return {el:box};
      return {el:box, check:() => ({got: rows.filter(r => r.inp.value.trim().toUpperCase() === r.wd.toUpperCase()).length, total: rows.length})};
    }
  };
  function speak(text){
    try { const u = new SpeechSynthesisUtterance(text); window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch(e) {}
  }
  function shell(i, s, body, ctx, cfg){
    const def = T[s.type];
    const text = (s.title && s.title.trim()) || def.instr(s, ctx.mode);
    const h2 = h('h2', null, h('span', {class:'badge'}, String(i + 1)), h('span', {class:'ttl'}, text), h('span', {class:'icon-hint'}, def.hint));
    if (ctx.mode === 'digital' && cfg.readAloud && window.speechSynthesis) h2.appendChild(h('button', {type:'button', class:'say', title:'Read aloud', 'aria-label':'Read aloud', onclick:() => speak(text)}, '🔊'));
    return h('section', {class:'act'}, h2, body);
  }
  function buildKey(cfg){
    const ul = h('ul');
    cfg.sections.forEach((s, i) => { const d = T[s.type]; if (d) ul.appendChild(h('li', null, h('b', null, (i + 1) + '. ' + d.label + ': '), d.key(s))); });
    return h('section', {class:'keypage'},
      h('h1', null, 'Staff page: do not hand out'),
      h('h2', null, 'Answer key'), ul,
      h('h2', null, 'Ways to adapt'),
      h('ul', null,
        h('li', null, 'Do it as a group with the page on a big screen. Let students come up to circle or draw.'),
        h('li', null, 'Say each direction out loud and point to the example. A peer helper works well.'),
        h('li', null, 'Use thick markers or dot markers for students with fine-motor challenges.'),
        h('li', null, 'Skip sections as needed. Word match is the only reading, and it is optional.')));
  }
  function dl(name, blob){
    const a = h('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  function mount(root, cfg, mode){
    root.textContent = '';
    root.classList.remove('ws-print', 'ws-digital'); root.classList.add('ws', 'ws-' + mode);
    const ctx = {mode}; const parts = [];
    const nameEl = mode === 'digital' ? h('input', {type:'text', placeholder:'Name', 'aria-label':'Name', autocomplete:'off'}) : null;
    let lastTypedName = '';
    if (nameEl) nameEl.addEventListener('input', () => { lastTypedName = nameEl.value.trim(); });
    root.appendChild(h('div', {class:'top'}, h('h1', null, cfg.emoji ? h('span', {class:'he'}, cfg.emoji) : null, cfg.title || 'Worksheet'), h('div', {class:'name'}, nameEl)));
    cfg.sections.forEach((s, i) => {
      if (!T[s.type]) return;
      const b = T[s.type].build(s, ctx);
      parts.push({s, b});
      root.appendChild(shell(i, s, b.el, ctx, cfg));
    });
    if (mode === 'print') { if (cfg.staffKey) root.appendChild(buildKey(cfg)); return; }

    const done = h('button', {type:'button', class:'bigbtn'}, "🎉 I'm done!");
    const out = h('div', {class:'resultwrap'});
    root.appendChild(h('div', {class:'donebar'}, done)); root.appendChild(out);

    done.addEventListener('click', () => {
      let got = 0, total = 0; const details = [];
      parts.forEach((p, i) => { if (!p.b.check) return; const r = p.b.check(); got += r.got; total += r.total; details.push({n:i + 1, label:T[p.s.type].label, got:r.got, total:r.total}); });
      const drawPart = parts.filter(p => p.b.canvas)[0];
      const drew = !!(drawPart && drawPart.b.hasDrawing());
      const pct = total ? got / total : 1;
      const stars = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
      try { nameEl.blur(); } catch(e) {}
      const liveVal = (nameEl.value || '').trim();
      const name = liveVal || lastTypedName;
      const text = () => {
        const L = [(cfg.title || 'Worksheet') + ' - results', 'Student: ' + (name || '(no name entered)'), 'Date: ' + new Date().toLocaleString(), 'Score: ' + got + ' of ' + total, ''];
        details.forEach(d => L.push(d.n + '. ' + d.label + ': ' + d.got + ' of ' + d.total));
        if (drawPart) L.push('', 'Drawing: ' + (drew ? 'made (saved as a picture by the student)' : 'not started'));
        return L.join('\n');
      };
      out.textContent = '';
      const chips = h('div', {class:'breakdown'}, details.map(d => h('span', {class:'chip ' + (d.got === d.total ? 'ok' : 'try')}, (d.got === d.total ? '✅ ' : '🔁 ') + d.n)));
      const em = h('input', {type:'email', class:'emailin', placeholder:'name@example.com', value:cfg.email || '', 'aria-label':'Email address for results'});
      const btns = h('div', {class:'rbtns'},
        h('button', {type:'button', class:'bigbtn', onclick:() => {
          const q = 'to=' + encodeURIComponent(em.value.trim()) + '&su=' + encodeURIComponent((cfg.subject || 'Worksheet results') + (name ? ' - ' + name : '')) + '&body=' + encodeURIComponent(text());
          const w = window.open('https://mail.google.com/mail/?view=cm&fs=1&' + q, '_blank');
          if (!w) window.location.href = 'https://mail.google.com/mail/?view=cm&fs=1&' + q;
        }}, '📧 Open in Gmail'),
        h('button', {type:'button', class:'tbtn big', onclick:() => {
          const a = h('a', {href:'mailto:' + em.value.trim() + '?subject=' + encodeURIComponent((cfg.subject || 'Worksheet results') + (name ? ' - ' + name : '')) + '&body=' + encodeURIComponent(text())});
          document.body.appendChild(a); a.click(); a.remove();
        }}, '✉️ Email app'),
        h('button', {type:'button', class:'tbtn big', onclick:function(){
          const btn = this, t = text();
          const ok = () => { btn.textContent = '✅ Copied'; setTimeout(() => { btn.textContent = '📋 Copy results'; }, 2000); };
          const fallback = () => { const ta = h('textarea', {style:'position:fixed;left:-999px'}); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e) {} ta.remove(); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
        }}, '📋 Copy results'),
        h('button', {type:'button', class:'tbtn big', onclick:() => dl('results' + (name ? '-' + name.replace(/[^\w-]+/g, '_') : '') + '.txt', new Blob([text()], {type:'text/plain'}))}, '💾 Save results file'),
        drawPart && drew ? h('button', {type:'button', class:'tbtn big', onclick:() => drawPart.b.canvas.toBlob(b => dl('my-design' + (name ? '-' + name.replace(/[^\w-]+/g, '_') : '') + '.png', b))}, '🖼️ Save my drawing') : null,
        h('button', {type:'button', class:'tbtn big', onclick:() => { mount(root, cfg, mode); window.scrollTo(0, 0); }}, '🔄 Start over'));
      out.appendChild(h('div', {class:'result'},
        h('div', {class:'stars'}, stars),
        h('h2', null, cfg.showScore ? 'You got ' + got + ' of ' + total + '!' : 'Great work!'),
        cfg.showScore ? chips : null,
        h('div', {class:'emailrow'}, h('label', null, '📧 Send to: '), em),
        btns,
        h('p', {class:'note'}, 'Open in Gmail needs internet and a Gmail sign-in. No internet? Use Copy results or Save results file. Attach the saved drawing if you want to send it too.')));
      out.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  window.WS = {mount:mount, h:h, glyphs:glyphs, PALETTE:PALETTE, NAMES:NAMES, TYPES:T};
})();
WS.mount(document.getElementById("root"),CONFIG,"digital");
</script></body></html>
